---
global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  - job_name: "flask-application"

    metrics_path: /metrics

    static_configs:

      - targets:
          - "13.203.194.176:8000"

        labels:
          environment: "aws"
          application: "observability-app"
          service: "flask"
